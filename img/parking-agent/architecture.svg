<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 740"
     font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif">
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10B981"/>
    </marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/>
    </marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="740" fill="#ffffff"/>

  <!-- Group 1: 입력 -->
  <rect x="20" y="20" width="720" height="90" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="40" y="44" fill="#64748B" font-size="11" font-weight="700" letter-spacing="0.8">입력</text>
  <g filter="url(#shadow)">
    <rect x="280" y="46" width="200" height="48" rx="24" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="380" y="71" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">실패 이벤트 수신</text>
  <text x="380" y="87" text-anchor="middle" fill="#64748B" font-size="11">자동화 봇 실패 · 환불 대상</text>

  <!-- Group 2: 복구 플로우 -->
  <rect x="20" y="130" width="720" height="150" rx="18" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="40" y="154" fill="#059669" font-size="11" font-weight="700" letter-spacing="0.8">복구 플로우 · 고객 출차를 되살리는 순서</text>

  <g filter="url(#shadow)">
    <rect x="48" y="172" width="124" height="88" rx="10" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
    <rect x="184" y="172" width="124" height="88" rx="10" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
    <rect x="320" y="172" width="124" height="88" rx="10" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
    <rect x="456" y="172" width="124" height="88" rx="10" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
    <rect x="592" y="172" width="124" height="88" rx="10" fill="#ffffff" stroke="#10B981" stroke-width="1.5"/>
  </g>

  <text x="110" y="204" text-anchor="middle" fill="#064E3B" font-size="14" font-weight="700">사이트 접속</text>
  <text x="110" y="224" text-anchor="middle" fill="#047857" font-size="11">외부 웹 진입</text>
  <text x="110" y="240" text-anchor="middle" fill="#047857" font-size="11">인터셉터 on</text>

  <text x="246" y="204" text-anchor="middle" fill="#064E3B" font-size="14" font-weight="700">로그인</text>
  <text x="246" y="224" text-anchor="middle" fill="#047857" font-size="11">자격증명 주입</text>
  <text x="246" y="240" text-anchor="middle" fill="#047857" font-size="11">LLM 격리</text>

  <text x="382" y="204" text-anchor="middle" fill="#064E3B" font-size="14" font-weight="700">차량 조회</text>
  <text x="382" y="224" text-anchor="middle" fill="#047857" font-size="11">번호판 검색</text>
  <text x="382" y="240" text-anchor="middle" fill="#047857" font-size="11">이용 건 매칭</text>

  <text x="518" y="204" text-anchor="middle" fill="#064E3B" font-size="14" font-weight="700">할인권 적용</text>
  <text x="518" y="224" text-anchor="middle" fill="#047857" font-size="11">할인권 선택</text>
  <text x="518" y="240" text-anchor="middle" fill="#047857" font-size="11">등록 · 저장</text>

  <text x="654" y="204" text-anchor="middle" fill="#064E3B" font-size="14" font-weight="700">검증</text>
  <text x="654" y="224" text-anchor="middle" fill="#047857" font-size="11">적용 재확인</text>
  <text x="654" y="240" text-anchor="middle" fill="#047857" font-size="11">(읽기 전용)</text>

  <!-- Arrows between recovery nodes -->
  <line x1="172" y1="216" x2="184" y2="216" stroke="#10B981" stroke-width="1.8" marker-end="url(#a-green)"/>
  <line x1="308" y1="216" x2="320" y2="216" stroke="#10B981" stroke-width="1.8" marker-end="url(#a-green)"/>
  <line x1="444" y1="216" x2="456" y2="216" stroke="#10B981" stroke-width="1.8" marker-end="url(#a-green)"/>
  <line x1="580" y1="216" x2="592" y2="216" stroke="#10B981" stroke-width="1.8" marker-end="url(#a-green)"/>

  <!-- Group 3: 판단 -->
  <rect x="20" y="300" width="720" height="150" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="40" y="324" fill="#EA580C" font-size="11" font-weight="700" letter-spacing="0.8">판단 · 무엇이 일어났는지 본다</text>

  <g filter="url(#shadow)">
    <rect x="130" y="342" width="220" height="88" rx="10" fill="#ffffff" stroke="#F97316" stroke-width="1.5"/>
    <rect x="410" y="342" width="220" height="88" rx="10" fill="#ffffff" stroke="#F97316" stroke-width="1.5"/>
  </g>

  <text x="240" y="376" text-anchor="middle" fill="#7C2D12" font-size="14" font-weight="700">원인 분석</text>
  <text x="240" y="396" text-anchor="middle" fill="#C2410C" font-size="11">DOM · 네트워크 · 에러 메시지</text>
  <text x="240" y="414" text-anchor="middle" fill="#C2410C" font-size="11">6가지 카테고리 분류</text>

  <text x="520" y="376" text-anchor="middle" fill="#7C2D12" font-size="14" font-weight="700">스키마와 실제 웹 비교</text>
  <text x="520" y="396" text-anchor="middle" fill="#C2410C" font-size="11">기록된 스키마 vs 현 화면</text>
  <text x="520" y="414" text-anchor="middle" fill="#C2410C" font-size="11">Diff 추출</text>

  <line x1="350" y1="386" x2="410" y2="386" stroke="#F97316" stroke-width="1.8" marker-end="url(#a-orange)"/>

  <!-- Group 4: 액션 -->
  <rect x="20" y="470" width="720" height="150" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="40" y="494" fill="#2563EB" font-size="11" font-weight="700" letter-spacing="0.8">액션 · 고치고 알린다</text>

  <g filter="url(#shadow)">
    <rect x="130" y="512" width="220" height="88" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="410" y="512" width="220" height="88" rx="10" fill="#ffffff" stroke="#3B82F6" stroke-width="1.5"/>
  </g>

  <text x="240" y="546" text-anchor="middle" fill="#1E3A8A" font-size="14" font-weight="700">Draft PR 자동 생성</text>
  <text x="240" y="566" text-anchor="middle" fill="#1D4ED8" font-size="11">셀렉터 · 엔드포인트 수정</text>
  <text x="240" y="584" text-anchor="middle" fill="#1D4ED8" font-size="11">개발자 리뷰 대기</text>

  <text x="520" y="546" text-anchor="middle" fill="#1E3A8A" font-size="14" font-weight="700">Slack 알림</text>
  <text x="520" y="566" text-anchor="middle" fill="#1D4ED8" font-size="11">담당자 태그 + 추적 링크</text>
  <text x="520" y="584" text-anchor="middle" fill="#1D4ED8" font-size="11">복구 여부 한 번에</text>

  <line x1="350" y1="556" x2="410" y2="556" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#a-blue)"/>

  <!-- END -->
  <g filter="url(#shadow)">
    <rect x="280" y="650" width="200" height="48" rx="24" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  </g>
  <text x="380" y="678" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="700">END</text>

  <!-- Cross-group arrows -->
  <!-- START → 사이트 접속 -->
  <path d="M 380,96 C 380,140 110,140 110,170" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>

  <!-- 검증 → 스키마 비교 (success) -->
  <path d="M 654,260 C 654,305 520,305 520,340" stroke="#10B981" stroke-width="1.8" fill="none" marker-end="url(#a-green)"/>
  <text x="598" y="295" fill="#059669" font-size="11" font-weight="600">성공 · 복구 완료</text>

  <!-- 로그인/조회/적용 → 원인 분석 (실패) -->
  <path d="M 246,260 C 246,295 200,320 195,340" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-orange)"/>
  <path d="M 382,260 C 382,295 240,320 240,340" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-orange)"/>
  <path d="M 518,260 C 518,295 290,320 285,340" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a-orange)"/>
  <text x="44" y="300" fill="#EA580C" font-size="11" font-weight="600">실패 분기</text>

  <!-- 스키마 비교 → Draft PR -->
  <path d="M 410,406 C 330,406 260,460 240,510" stroke="#2563EB" stroke-width="1.8" fill="none" marker-end="url(#a-blue)"/>
  <text x="280" y="465" fill="#2563EB" font-size="11" font-weight="600">변경 감지</text>

  <!-- 스키마 비교 → Slack (변경 없음) -->
  <path d="M 580,430 C 580,465 540,495 535,510" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>
  <text x="594" y="468" fill="#64748B" font-size="11" font-weight="600">변경 없음</text>

  <!-- Slack → END -->
  <path d="M 480,602 C 480,625 430,648 420,650" stroke="#64748B" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>
</svg>
